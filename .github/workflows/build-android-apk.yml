name: Build Android Mini App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD before building."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          android sdk install "platform-tools" --sdk="$ANDROID_HOME"
          android sdk install "platforms;android-35" --sdk="$ANDROID_HOME"
          android sdk install "build-tools;36.1.0" --sdk="$ANDROID_HOME"

      - name: Configure Bubblewrap tool paths
        working-directory: android
        run: npx --yes @bubblewrap/cli@1.27.0 updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

      - name: Update Android project version
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((VERSION_CODE + 1))
          VERSION_NAME="1.0.${VERSION_CODE}"
          VERSION_NAME="$VERSION_NAME" node -e "const fs=require('node:fs');const p='twa-manifest.json';const m=JSON.parse(fs.readFileSync(p,'utf8'));m.appVersionCode=Number(process.env.VERSION_CODE);m.appVersion=process.env.VERSION_NAME;fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n')"
          npx --yes @bubblewrap/cli@1.27.0 update --manifest=twa-manifest.json --skipVersionUpgrade

      - name: Disable release minification
        working-directory: android
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/build.gradle';
          const source = fs.readFileSync(path, 'utf8');
          const updated = source.replace(/(\brelease\s*\{\s*\r?\n\s*)minifyEnabled true/, '$1minifyEnabled false');
          if (updated === source) {
            throw new Error('Expected Bubblewrap release minification setting was not found.');
          }
          fs.writeFileSync(path, updated);
          NODE

      - name: Register Browser Helper data manager activity
        working-directory: android
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/src/main/AndroidManifest.xml';
          const source = fs.readFileSync(path, 'utf8');
          const component = 'com.google.androidbrowserhelper.trusted.ManageDataLauncherActivity';
          if (!source.includes(component)) {
            const applicationEnd = '    </application>';
            if (!source.includes(applicationEnd)) {
              throw new Error('Android application manifest has no closing application tag.');
            }
            const activity = `        <activity android:name="${component}" android:exported="false" />\n`;
            fs.writeFileSync(path, source.replace(applicationEnd, `${activity}${applicationEnd}`));
          }
          NODE

      - name: Prepare release signing key
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-key.jks

      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          npx --yes @bubblewrap/cli@1.27.0 build --manifest=twa-manifest.json --skipPwaValidation \
            --signingKeyPath=upload-key.jks --signingKeyAlias="$ANDROID_KEY_ALIAS"
          cp app-release-signed.apk "$RUNNER_TEMP/milano-foods-miniapp.apk"

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Milano Foods Mini App v1.0.${{ github.run_number }}
          body: Signed Android APK for the Milano Foods operations Mini App.
          files: ${{ runner.temp }}/milano-foods-miniapp.apk
